version: '3.8'

services:
  # Frontend - React Application (served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: https://api-be.vidyutai.in/api/v1
        VITE_AI_BASE_URL: https://api-python-be.vidyutai.in
        VITE_WS_URL: wss://api-be.vidyutai.in
    container_name: vidyutai-frontend
    ports:
      - "8080:80"
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M

  # Backend - Node.js + Express
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vidyutai-backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - JWT_EXPIRE=${JWT_EXPIRE:-24h}
      - DATABASE_PATH=/app/database/vidyutai.db
      - AI_SERVICE_URL=${AI_SERVICE_URL:-http://ai-service:8000}
      - FRONTEND_URL=${FRONTEND_URL:-https://spel.vidyutai.in}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://spel.vidyutai.in,https://api-be.vidyutai.in,https://api-python-be.vidyutai.in}
      - NODE_OPTIONS=--max-old-space-size=384
      # Optional: PostgreSQL (if using instead of SQLite)
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_URL=${POSTGRES_URL:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-}
      - POSTGRES_PORT=${POSTGRES_PORT:-}
      - POSTGRES_USER=${POSTGRES_USER:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=${POSTGRES_DB:-}
    volumes:
      - vidyutai-db:/app/database
      - ./backend/uploads:/app/uploads
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Service - Python FastAPI
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-service
    container_name: vidyutai-ai-service
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - DEBUG=${DEBUG:-False}
      - DATABASE_PATH=/app/database/vidyutai.db
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
      # Security
      - SECRET_KEY=${SECRET_KEY:-default-secret-key-change-in-production}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      # API Keys (important for AI features)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}  # Legacy support (deprecated)
      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - PYTHON_ENV=${PYTHON_ENV:-production}
      # Optional: External databases/services
      - MONGODB_URI=${MONGODB_URI:-}
      - INFLUXDB_URL=${INFLUXDB_URL:-}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN:-}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-vidyutai}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-energy_data}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-}
      - KAFKA_CONSUMER_GROUP=${KAFKA_CONSUMER_GROUP:-vidyutai-ai-service}
      - KAFKA_TOPIC_ENERGY_DATA=${KAFKA_TOPIC_ENERGY_DATA:-energy-data}
      - KAFKA_TOPIC_ANOMALIES=${KAFKA_TOPIC_ANOMALIES:-energy-anomalies}
      # Model settings
      - MODEL_PATH=${MODEL_PATH:-./app/ml-models}
      - ANOMALY_DETECTION_MODEL=${ANOMALY_DETECTION_MODEL:-isolation_forest_model.pkl}
      - PREDICTION_MODEL=${PREDICTION_MODEL:-energy_prediction_model.pkl}
    volumes:
      - vidyutai-db:/app/database:ro
      - ./ai-service/app/ml-models:/app/app/ml-models
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 400M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vidyutai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - ./infrastructure/nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M

networks:
  vidyutai-network:
    driver: bridge

volumes:
  vidyutai-db:
    driver: local
