version: '3.8'

services:
  # Frontend - React Application (served via Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: https://api-be.vidyutai.in/api/v1
        VITE_AI_BASE_URL: https://api-python-be.vidyutai.in
        VITE_WS_URL: wss://api-be.vidyutai.in
    container_name: vidyutai-frontend
    ports:
      - "8080:80"
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M

  # Backend - Node.js + Express
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: vidyutai-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:-change-this-secret-in-production}
      - DATABASE_PATH=/app/database/vidyutai.db
      - AI_SERVICE_URL=http://ai-service:8000
      - CORS_ORIGIN=https://spel.vidyutai.in,https://api-be.vidyutai.in,https://api-python-be.vidyutai.in
      - NODE_OPTIONS=--max-old-space-size=384
    volumes:
      - vidyutai-db:/app/database
      - ./backend/uploads:/app/uploads
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # AI Service - Python FastAPI
  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.ai-service
    container_name: vidyutai-ai-service
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=False
      - DATABASE_PATH=/app/database/vidyutai.db
      - PYTHONUNBUFFERED=1
      - MALLOC_ARENA_MAX=2
    volumes:
      - vidyutai-db:/app/database:ro
      - ./ai-service/app/ml-models:/app/app/ml-models
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 800M
        reservations:
          memory: 400M
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: vidyutai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
      - ./infrastructure/nginx/logs:/var/log/nginx
    depends_on:
      - frontend
      - backend
      - ai-service
    networks:
      - vidyutai-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M

networks:
  vidyutai-network:
    driver: bridge

volumes:
  vidyutai-db:
    driver: local
