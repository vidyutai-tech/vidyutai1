# Netlify configuration for VidyutAI Frontend
# This file should be in the root directory of the repository

[build]
  # Base directory for the build (relative to repository root)
  base = "frontend"
  
  # Build command
  command = "npm install && npm run build"
  
  # Directory to publish (relative to base)
  publish = "dist"

# SPA redirects - redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for caching static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

