# Render.com deployment configuration for VidyutAI
# Free tier deployment: https://render.com
#
# IMPORTANT NOTES:
# 1. This file deploys Backend (Node.js) and AI Service (Python FastAPI) to Render
# 2. Frontend should be deployed separately to Vercel (see DEPLOYMENT_GUIDE.md)
# 3. After deployment, set environment variables in Render dashboard
# 4. Update frontend VITE_API_BASE_URL to point to Render backend URL
# 5. Update backend AI_SERVICE_URL to point to Render AI service URL

services:
  # Backend Service (Node.js/Express)
  - type: web
    name: vidyutai-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000  # Render free tier uses port from PORT env var or 10000
      # Add these in Render dashboard after deployment:
      # - JWT_SECRET (generate a random secret)
      # - AI_SERVICE_URL (will be https://vidyutai-ai-service.onrender.com)
      # - FRONTEND_URL (will be your Vercel frontend URL)
      # - CORS_ORIGIN (your Vercel frontend URL)
    healthCheckPath: /health

  # AI Service (Python FastAPI)
  - type: web
    name: vidyutai-ai-service
    env: python
    region: oregon
    plan: free
    buildCommand: cd ai-service && pip install -r requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000  # Render free tier uses port from PORT env var or 10000
      # Add these in Render dashboard after deployment:
      # - OPENAI_API_KEY (required for AI insights)
      # - SECRET_KEY (generate a random secret)
    healthCheckPath: /health
